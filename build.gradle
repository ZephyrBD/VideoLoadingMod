plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'maven-publish'
    id 'com.github.hierynomus.license' version '0.16.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        videoloading {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // 国内镜像优先
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    // NeoForge 官方 maven（maven.neoforged.net）国内 DNS 污染不可达，
    // 用 CreeperHost / BMCLAPI 镜像（CreeperHost 元数据齐全，BMCLAPI 仅有 jar）
    maven {
        name = 'CreeperHost'
        url = 'https://maven.creeperhost.net/'
    }
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven/'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

processResources {
    inputs.property "version", project.mod_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// ===== License 插件配置 =====
license {
    // 指定头文件
    header rootProject.file('LICENSE-HEADER.txt')

    include '**/*.java'

    // Java 文件使用标准注释风格
    mapping {
        java = 'SLASHSTAR_STYLE'
    }

    // 排除无需检查的目录
    exclude '**/generated/**'
    exclude '**/META-INF/**'
}

// 每次构建前检查 license
check.dependsOn 'licenseFormat'

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // 在这里配置 maven 仓库
    }
}
