plugins {
    id 'net.minecraftforge.gradle' version '[6.0.30,6.1)'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // 国内镜像优先，Forge 官方 maven 必须直连
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"


    // Mixin 注解处理器：生成 refmap（Forge 生产环境是 SRG 名，必须映射）
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version

    copyIdeResources = false

    runs {
        client {
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            // Forge 不支持 mods.toml 的 [[mixins]]，dev 环境没有 jar manifest，
            // 必须用该参数让 Mixin 加载配置（生产环境由 jar manifest 的 MixinConfigs 属性声明）
            args '--mixin.config=videoloading.mixins.json'
            mods { videoloading { source sourceSets.main } }
        }
    }
}

processResources {
    inputs.property "version", project.mod_version

    filesMatching("META-INF/mods.toml") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

// Mixin 注解处理器生成 refmap 需要 srg↔official 的 tsrg 映射，
// ForgeGradle 不自动注入，这里手动处理：其缓存里的 srg_to_official.tsrg
// 左列是 SRG、右列是 official，而注解处理器需要以 compile 名（official）
// 为 key 反查 SRG，因此把两列对调后写进 build 目录供 -AreobfTsrgFile 使用
def srgToOfficialTsrg = fileTree("${System.getProperty('user.home')}/.gradle/caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config") {
    include "1.21.1-*/srg_to_official_${project.minecraft_version}.tsrg"
}.singleFile

def officialToSrgTsrgFile = layout.buildDirectory.file("mixin-mappings/official_to_srg.tsrg").get().asFile

// 简单起见在配置期直接转换（24 万行，开销可忽略）
officialToSrgTsrgFile.parentFile.mkdirs()
officialToSrgTsrgFile.text = srgToOfficialTsrg.readLines('UTF-8').collect { line ->
    if (line.isEmpty() || line.startsWith('\t\t')) {
        return line                            // 参数行与空行原样保留
    }
    if (line.startsWith('\t')) {
        def parts = line.substring(1).split(' ')
        if (parts.length == 3) {
            return "\t${parts[2]} ${parts[1]} ${parts[0]}"   // 方法行：srg desc official → official desc srg
        } else if (parts.length == 2) {
            return "\t${parts[1]} ${parts[0]}"               // 字段行：srg official → official srg
        }
        return line                            // static 标记行原样保留
    }
    def parts = line.split(' ')
    return parts.length == 2 ? "${parts[1]} ${parts[0]}" : line  // 类行：srg official → official srg
}.join('\n')

def refmapOutputDir = layout.buildDirectory.dir("mixin-refmap").get().asFile

compileJava {
    options.compilerArgs += [
            '-AdefaultObfuscationEnv=searge',
            '-AmappingTypes=tsrg',
            "-AreobfTsrgFile=${officialToSrgTsrgFile.absolutePath}",
            "-AoutRefMapFile=${refmapOutputDir}/videoloading.refmap.json"
    ]
}

// 把 classes 与 resources 合并到同一输出目录。
// Minecraft 1.20.5+ 的 FML 移除了 MOD_CLASSES/UnionFileSystem 机制，模块必须
// 是单个目录；不合并的话 runClient 只会把 build/resources/main 当 mod 文件，
// 扫不到 @Mod 类，报 "constructed 0 mods"。
// （1.21.1 官方 MDK 同款写法，日后会迁移进 ForgeGradle 本体）
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    // refmap 只随 jar 发布（SRG 名），dev 运行时输出目录里没有它，
    // Mixin 会直接用注解里的官方名匹配 dev 的官方名运行时
    from(refmapOutputDir) {
        include 'videoloading.refmap.json'
    }

    manifest {
        attributes([
                'Specification-Title'     : 'videoloading',
                'Specification-Vendor'    : 'ZephyrBD',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.base.archivesName.get(),
                'Implementation-Vendor'   : 'ZephyrBD',
                'Implementation-Version'  : project.jar.archiveVersion.get(),
                'MixinConfigs'            : 'videoloading.mixins.json'
        ])
    }

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // 在这里配置 maven 仓库
    }
}
