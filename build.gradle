plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version "${moddev_legacy_version}"
    id 'com.github.hierynomus.license' version '0.16.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Mojang 1.20.1 发行版使用 Java 17 运行，mod 目标 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        // NeoForge 1.20.1：fork 自 Forge 47，maven 坐标仍是 net.neoforged:forge
        // 必须用 neoForgeVersion（forgeVersion= 会走 net.minecraftforge:forge）
        neoForgeVersion = "${minecraft_version}-${forge_version}"
    }

    // 仅保留客户端运行配置；不跑 runClient，仅用于生成正确的运行元数据
    runs {
        client {
            client()
            // Forge 1.20.1 不支持 mods.toml 的 [[mixins]]，dev 环境没有 jar manifest，
            // 必须用该参数让 Mixin 在早期阶段加载配置（生产环境由 jar manifest 的 MixinConfigs 属性声明）
            programArgument '--mixin.config'
            programArgument 'videoloading.mixins.json'
        }
    }

    mods {
        videoloading {
            sourceSet sourceSets.main
        }
    }
}

// ===== Mixin（Forge 1.20.1 运行时为 SRG 名，必须生成 refmap）=====
mixin {
    add sourceSets.main, "${archives_base_name}.refmap.json"
    config "${archives_base_name}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras AP：给 @WrapOperation 等注入器的 @At 目标生成 refmap 条目
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
    // Forge 1.20.1 不内置 MixinExtras：编译用 common，运行时随 jar 内嵌 forge 版
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.5.5')) {
        version {
            strictly '[0.5.5,0.6.0)'
            prefer '0.5.5'
        }
    }
}

jar {
    manifest.attributes([
            'MixinConfigs': "${archives_base_name}.mixins.json"
    ])
}

processResources {
    inputs.property 'version', project.mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.mod_version
    }
}

repositories {
    // 国内镜像优先；NeoForge maven 需直连（当前环境走代理）
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// ===== License 插件配置 =====
license {
    // 指定头文件
    header rootProject.file('LICENSE-HEADER.txt')

    include '**/*.java'

    // Java 文件使用标准注释风格
    mapping {
        java = 'SLASHSTAR_STYLE'
    }

    // 排除无需检查的目录
    exclude '**/generated/**'
    exclude '**/META-INF/**'
}

// 每次构建前检查 license
check.dependsOn 'licenseFormat'

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // 在这里配置 maven 仓库
    }
}
