name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('*.gradle', 'gradle.properties', 'settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Rename jar
        run: cp build/libs/videoloading-1.0.jar "videoloading-1.21.1-neoforge-1.0.jar"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "VideoLoading $TAG" --notes "VideoLoading $TAG — 按 MC 版本和加载器选择对应 jar"
          gh release upload "$TAG" "videoloading-1.21.1-neoforge-1.0.jar" --clobber
