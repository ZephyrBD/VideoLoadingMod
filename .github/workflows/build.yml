name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            java: 21
            mc: 1.21.1
            loader: fabric
          - branch: 1.21.1-forge
            java: 21
            mc: 1.21.1
            loader: forge
          - branch: 1.21.1-neoforge
            java: 21
            mc: 1.21.1
            loader: neoforge
          - branch: 1.20.1-fabric
            java: 21
            mc: 1.20.1
            loader: fabric
          - branch: 1.20.1-forge
            java: 21
            mc: 1.20.1
            loader: forge
          - branch: 1.20.1-neoforge
            java: 21
            mc: 1.20.1
            loader: neoforge
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/fabric-loom
          key: gradlev2-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('*.gradle', 'gradle.properties', 'settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-${{ matrix.branch }}-

      - name: Build
        run: sh ./gradlew build --no-daemon --console=plain

      - name: Rename jar
        run: cp build/libs/videoloading-1.0.jar "videoloading-${{ matrix.mc }}-${{ matrix.loader }}-1.0.jar"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "VideoLoading $TAG" --notes "VideoLoading $TAG — 按 MC 版本和加载器选择对应 jar"
          gh release upload "$TAG" "videoloading-${{ matrix.mc }}-${{ matrix.loader }}-1.0.jar" --clobber
