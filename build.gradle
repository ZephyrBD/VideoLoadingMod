// MixinGradle 通过 buildscript 引入（它不在插件市场发布）
buildscript {
    repositories {
        maven {
            name = 'Aliyun'
            url = 'https://maven.aliyun.com/repository/public'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        mavenCentral()
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:${project.mixingradle_version}"
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 1.20.1 official（Mojang）映射，生产环境由 reobfJar 转回 SRG
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            mods { videoloading { source sourceSets.main } }
        }
    }
}

dependencies {
    // Forge 官方源（阿里云没有 Forge artifacts）
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Mixin 注解处理器：生成 refmap（生产环境 SRG 名映射）
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
}

mixin {
    add sourceSets.main, "${project.archives_base_name}.refmap.json"
    config "${project.archives_base_name}.mixins.json"
}

repositories {
    // 国内依赖走阿里云；Forge/Mojang 相关由 ForgeGradle 自行处理
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
}

processResources {
    inputs.property "version", project.mod_version

    filesMatching("META-INF/mods.toml") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    // 生产环境类名是 SRG，构建产物必须重混淆
    finalizedBy 'reobfJar'
}


publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // 在这里配置 maven 仓库
    }
}
